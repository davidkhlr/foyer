<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Foyer">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10162A" media="(prefers-color-scheme: dark)">
<title>Foyer</title>
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E7EBF1; --ink:#18213A; --muted:#5E6782; --line:#DCE1EA;
  --brand:#2F54EB; --brand-ink:#FFFFFF; --both:#1F9D6B; --danger:#C93434;
  color-scheme:light;
  font-family:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10162A; --surface:#1A2238; --sunk:#141B30; --ink:#EEF1F8; --muted:#9BA4BE; --line:#2A3452;
    --brand:#7B93FF; --brand-ink:#0D1430; --both:#3CC48D; --danger:#FF7A7A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15}

#app{max-width:640px;margin:0 auto;padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
#app.plain{padding-bottom:env(safe-area-inset-bottom)}

/* En-tête */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 20px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top);background:var(--bg);z-index:10}
.today{font-size:clamp(26px,7.5vw,34px);font-weight:800;letter-spacing:-.025em}
.who-row{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--muted);font-size:14px}
.avatar{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:800;color:#fff;margin-right:-6px;border:2px solid var(--bg)}
.who-row .avatar:last-of-type{margin-right:4px}
.iconbtn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn.sm{width:38px;height:38px;font-size:22px;line-height:1}
.iconbtn svg{width:22px;height:22px}

main{padding:4px 16px 24px}

/* Barre d'onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:640px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--brand);font-weight:600}
nav.tabs svg{width:24px;height:24px}

/* Éléments communs */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px}
.bar h2{font-size:20px;font-weight:600;text-align:center;flex:1}
.btn{border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);padding:12px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%;margin-top:18px}
.btn:disabled{opacity:.5}
.link{background:none;border:0;padding:6px 0;color:var(--brand);font-weight:600}
.hint,.empty p{color:var(--muted)}
.empty{text-align:center;padding:40px 10px}
.sub{font-size:15px;font-weight:600;color:var(--muted);margin:26px 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.fab{position:fixed;right:max(20px, calc(50vw - 300px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:9;width:58px;height:58px;border-radius:18px;border:0;background:var(--brand);color:var(--brand-ink);font-size:32px;line-height:1;box-shadow:0 8px 20px -6px rgba(47,84,235,.55)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:50;max-width:88vw;text-align:center}

/* Agenda : grille du mois avec barres d'évènements */
.month{--lane:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.mhead span{text-align:center;font-size:13px;font-weight:600;padding:9px 0}
.mweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px;min-height:84px;border-bottom:1px solid var(--line)}
.mweek:last-child{border-bottom:0}
.mcell{grid-row:1/-1;border:0;border-left:1px solid var(--line);background:transparent;padding:4px 6px;display:flex;justify-content:flex-end;align-items:flex-start;font-weight:600;font-size:13px}
.mcell:first-child{border-left:0}
.mcell .num{min-width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.mcell.out .num{color:var(--muted);opacity:.6;font-weight:400}
.mcell.ferie .num{color:var(--danger)}
.mcell.is-today{background:var(--sunk)}
.mcell.is-today .num{background:var(--brand);color:var(--brand-ink)}
.mcell.sel{box-shadow:inset 0 0 0 2px var(--brand)}
.eb{position:relative;z-index:1;min-width:0;height:var(--lane);line-height:var(--lane);margin:0 3px;padding:0 5px;border:0;border-radius:4px;font-size:12px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.eb b{font-weight:600;margin-right:4px}
.eb.l{margin-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.eb.r{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
span.eb{pointer-events:none}
.emore{position:relative;z-index:1;border:0;background:none;text-align:left;padding:0 6px;font-size:12px;font-weight:600;color:var(--muted);height:var(--lane)}
@media (min-width:600px){.month{--lane:22px}.mweek{min-height:112px}.eb{font-size:13px}.mcell{font-size:15px}.mhead span{font-size:14px}}
@media (min-width:900px){#app.wide{max-width:1180px}#app.wide .fab{right:max(20px,calc(50vw - 570px))}}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.dayhead h3{font-size:22px;font-weight:800;letter-spacing:-.01em}
.evlist{list-style:none;margin:0;padding:0}
.evlist li+li{border-top:1px solid var(--line)}
.ev{width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;background:none;border:0;padding:14px 16px}
.ev .time{flex:none;width:64px;font-weight:600;font-variant-numeric:tabular-nums}
.ev .time small{display:block;color:var(--muted);font-weight:400}
.ev .stripe{flex:none;width:4px;align-self:stretch;border-radius:4px}
.ev .body{flex:1;min-width:0}
.ev .body strong{display:block;font-weight:600}
.ev .body span{color:var(--muted);font-size:14px}

/* Listes */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600}
.chip[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip em{font-style:normal;opacity:.65;margin-left:4px}
.chip.add{width:40px;padding:8px 0}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
textarea{resize:vertical}
.lhead{position:relative;margin-bottom:12px}
.lbanner{position:relative;overflow:hidden;min-height:124px;border-radius:18px;background:var(--brand);color:var(--brand-ink);padding:16px 18px;display:flex;align-items:flex-end}
.lbanner h2{position:relative;z-index:1;display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;letter-spacing:-.01em;max-width:calc(100% - 110px);overflow-wrap:anywhere}
.lbanner h2 svg{flex:none;width:26px;height:26px}
.lbanner .art{position:absolute;right:-4px;bottom:-8px;width:124px;height:124px}
.lhead .kebab{position:absolute;top:10px;right:10px;z-index:2;background:rgba(255,255,255,.92);color:#18213A}
.lhead .kmenu{top:52px;right:10px}
.newrow{position:relative;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 6px 5px 14px}
.newrow:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.newrow>svg{flex:none;width:24px;height:24px;color:var(--muted)}
.newrow input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0}
.newrow input:focus{outline:none}
.send{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;padding:0}
.send svg{width:20px;height:20px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:4;list-style:none;margin:0;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 30px -12px rgba(10,14,30,.35)}
.sugg:empty{display:none}
.sugg button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:11px 12px;border-radius:9px;font-weight:400}
.sugg button:hover,.sugg button.on{background:var(--sunk)}
.sugg b{font-weight:800}
.sugg small{margin-left:auto;color:var(--muted);font-size:12px}
.items{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.items li{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.check{flex:1;min-width:0;display:flex;align-items:center;gap:18px;background:none;border:0;padding:15px 16px;text-align:left;font-weight:600}
.check .t{overflow-wrap:anywhere}
.box{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--brand);display:grid;place-items:center}
.check[aria-pressed="true"]{font-weight:400}
.check[aria-pressed="true"] .box{background:var(--muted);border-color:var(--muted)}
.check[aria-pressed="true"] .box::after{content:"";width:5px;height:10px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check[aria-pressed="true"] .t{color:var(--muted)}
.x{flex:none;width:44px;height:44px;background:none;border:0;color:var(--muted);font-size:22px;opacity:.55}
.x:hover,.x:focus-visible{opacity:1}

/* Repas */
.week{display:flex;flex-direction:column;gap:10px}
.mday{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.mday.is-today{border-color:var(--brand);box-shadow:inset 4px 0 0 var(--brand)}
.mday h3{font-size:16px;font-weight:600;margin:0 0 8px 2px}
.mday h3 span{color:var(--muted);font-weight:400}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{text-align:left;border:0;background:var(--sunk);border-radius:12px;padding:10px 12px;min-height:62px;display:flex;flex-direction:column;gap:2px}
.slot small{color:var(--muted);font-size:12px}
.slot span{font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.slot:not(.filled) span{color:var(--muted);font-weight:400}

/* Budget */
.balance{background:var(--ink);color:var(--bg);border-radius:20px;padding:20px}
.balance p{margin:0;opacity:.8;font-size:15px}
.balance .amt{font-size:clamp(34px,10vw,46px);font-weight:800;letter-spacing:-.03em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.balance .btn{margin-top:14px;background:var(--bg);color:var(--ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stats small{color:var(--muted);display:block}
.stats strong{font-size:22px;font-variant-numeric:tabular-nums}
.cats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.cats li{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:15px}
.meter{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:6px}
.cats b{font-weight:600;font-variant-numeric:tabular-nums}
.exp{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:13px 16px;text-align:left}
.exp .dot{flex:none;width:10px;height:10px;border-radius:50%}
.exp .body{flex:1;min-width:0}
.exp .body strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .body span{color:var(--muted);font-size:14px}
.exp .amt{font-weight:600;font-variant-numeric:tabular-nums}

/* Feuilles modales */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,14,30,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet h2{font-size:22px;font-weight:800}
.sheet label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.sheet label input,.sheet label select,.sheet label textarea{color:var(--ink);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.actions .btn{flex:1}
fieldset{border:0;padding:0;margin:0}
legend{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:8px}
.swatches{display:flex;gap:10px}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{display:block;width:36px;height:36px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px transparent}
.sw input:checked+span{box-shadow:0 0 0 2px var(--ink)}
.sw input:focus-visible+span{outline:3px solid var(--brand);outline-offset:3px}
.seg{display:flex;flex-direction:column;gap:8px}
.seg label{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-weight:400;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.seg input{width:auto}
.invite{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.invite p{margin:0;color:var(--muted);font-size:14px}
.invite code{font-size:14px;word-break:break-all;background:var(--sunk);padding:10px;border-radius:10px}

/* Écrans d'accueil */
.gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 22px;gap:18px}
.gate h1{font-size:44px;font-weight:800;letter-spacing:-.035em}
.gate .lead{margin:0;color:var(--muted);font-size:17px;max-width:34ch}
.gate form{display:flex;flex-direction:column;gap:12px}
.gate label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.gate label input{color:var(--ink);font-weight:400}
.gate .row{display:flex;gap:10px}
.gate .row .btn{flex:1}
.gate hr{border:0;border-top:1px solid var(--line);margin:8px 0;width:100%}
.err{color:var(--danger);font-size:15px;margin:0;min-height:1em}

[hidden]{display:none!important}
/* Détails d'un évènement */
.shead{position:relative}
.kebab{grid-column:3;grid-row:1;width:36px;height:36px;border-radius:50%;border:0;background:var(--sunk);display:grid;place-items:center;padding:0}
.kebab svg{width:20px;height:20px}
.kmenu{position:absolute;right:0;top:44px;z-index:2;min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.35);padding:6px;display:flex;flex-direction:column}
.kmenu button{border:0;background:none;text-align:left;padding:11px 12px;border-radius:8px;font-weight:600}
.kmenu button:hover{background:var(--sunk)}
.kmenu .danger{color:var(--danger)}
.dtitle{display:flex;align-items:center;gap:16px;padding:6px 2px}
.dico{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff}
.dico svg{width:26px;height:26px}
.dtitle h3{font-size:20px;font-weight:600;overflow-wrap:anywhere}
.drows{list-style:none;margin:0;padding:0 2px;display:flex;flex-direction:column;gap:18px}
.drows li{display:flex;align-items:center;gap:16px}
.drows li>svg{flex:none;width:52px;height:24px;color:var(--c)}
.drows li>div{font-weight:600;font-size:15px;overflow-wrap:anywhere;white-space:pre-line}
.drows small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.drows .avs{display:flex;gap:6px;align-items:center}
.drows .avs .avatar{width:34px;height:34px;font-size:14px;margin:0;border:0}
.hol .ev{cursor:default}
.hol .time{color:var(--muted);font-weight:400}
.stripe.f{background:var(--danger)}
.stripe.p{background:repeating-linear-gradient(180deg,var(--muted) 0 4px,transparent 4px 7px)}
.shead{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin:-6px -4px 4px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.shead h2{grid-column:2;text-align:center;font-size:20px}
.closex{grid-column:1;grid-row:1;width:36px;height:36px;border-radius:50%;border:0;background:var(--sunk);font-size:16px;font-weight:800}
.sheet input.big{padding:16px;font-size:17px}
.sheet label.toggle{flex-direction:row;align-items:center;gap:12px;color:var(--ink);font-size:16px;cursor:pointer}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.track{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.toggle input:checked+.track{background:var(--brand)}
.toggle input:checked+.track::after{transform:translateX(18px)}
.toggle input:focus-visible+.track{outline:3px solid var(--brand);outline-offset:2px}
.sheet legend{color:var(--ink)}
.sheet legend b{color:var(--brand);font-weight:600}
.palette{display:grid;grid-template-columns:repeat(9,1fr);gap:12px 4px;justify-items:center}
.sheet label.pc{display:block;cursor:pointer}
.pc input{position:absolute;opacity:0;pointer-events:none}
.pc span{display:block;width:30px;height:30px;border-radius:50%;border:4px solid var(--c);transition:background .12s}
.pc input:checked+span{background:var(--c)}
.pc input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px}
.people{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.psep{width:1px;height:34px;background:var(--line)}
.pp{width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;font-size:17px;padding:0;opacity:.4;transition:opacity .12s}
.pp.all{background:var(--sunk);color:var(--muted)}
.pp.all svg{width:28px;height:28px}
.pp[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--brand)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.more{display:flex;flex-direction:column;gap:14px}
@media (max-width:380px){.palette{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   CONFIGURATION — collez ici l'URL et la clé "anon public" de votre
   projet Supabase (Project Settings > API). Si vous laissez vide,
   l'app les demande au premier lancement.

function cfg() {
  if (SUPABASE_URL && SUPABASE_ANON_KEY) return { url: SUPABASE_URL, key: SUPABASE_ANON_KEY };
  try { return JSON.parse(localStorage.getItem('foyer_cfg')); } catch { return null; }

async function boot() {
  makeIcon();
  const c = cfg();
  if (!c || !c.url || !c.key) return screenConfig();
  try {
    S.sb = supabase.createClient(c.url, c.key, { auth: { persistSession: true, autoRefreshToken: true } });
    S.sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { S.user = null; S.hh = null; screenAuth(); } });
    const { data: { session } } = await S.sb.auth.getSession();
    if (!session) return screenAuth();
    S.user = session.user;
    await loadHousehold();
  } catch (e) { screenError(e); }
}

async function loadHousehold() {
  const { data, error } = await S.sb.from('members')
    .select('household_id, households(id, name)').eq('user_id', S.user.id).limit(1);
  if (error) return screenError(error);
  if (!data.length) return screenHousehold();
  S.hh = data[0].households;
  try { await loadAll(); } catch (e) { return screenError(e); }

const Q = {
  members: q => q.order('joined_at'),
  events: q => q.order('day').order('start_time', { nullsFirst: true }),
  lists: q => q.order('position').order('created_at'),
  list_items: q => q.order('created_at'),
  meals: q => q,
  expenses: q => q.order('day', { ascending: false }).order('created_at', { ascending: false }),
};
const KEY = { members: 'members', events: 'events', lists: 'lists', list_items: 'items', meals: 'meals', expenses: 'expenses' };

async function reload(t) {
  const { data, error } = await Q[t](S.sb.from(t).select('*').eq('household_id', S.hh.id));
  if (error) throw error;
  S[KEY[t]] = data;
}
const loadAll = () => Promise.all(Object.keys(Q).map(reload));

async function run(t, promise) {
  const { error } = await promise;
  if (error) { toast(errMsg(error)); throw error; }
  await reload(t);
  render();
}

function subscribe() {
  if (S.channel) S.sb.removeChannel(S.channel);
  const timers = {};
  S.channel = S.sb.channel('foyer-' + S.hh.id);
  for (const t of Object.keys(Q)) {
    S.channel.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => {
      clearTimeout(timers[t]);
      timers[t] = setTimeout(() => reload(t).then(render).catch(console.error), 200);
    });
  }
  S.channel.subscribe();
}

/* ---------- Jours fériés et fêtes ---------- */
function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    n = h + l - 7 * m + 114;
  return new Date(y, Math.floor(n / 31) - 1, (n % 31) + 1);
}
const nthSunday = (y, m, n) => { const d = new Date(y, m, 1); return addDays(d, (7 - d.getDay()) % 7 + 7 * (n - 1)); };
const lastSunday = (y, m) => { const d = new Date(y, m + 1, 0); return addDays(d, -d.getDay()); };
const HCACHE = {};
function holidays(y) {
  if (HCACHE[y]) return HCACHE[y];
  const E = easter(y), H = {};
  const add = (d, name, ferie) => (H[ymd(d)] ||= []).push({ name, ferie });
  // Jours fériés
  add(new Date(y, 0, 1), "Jour de l'An", 1);
  add(addDays(E, 1), 'Lundi de Pâques', 1);
  add(new Date(y, 4, 1), 'Fête du Travail', 1);
  add(new Date(y, 4, 8), 'Victoire 1945', 1);
  add(addDays(E, 39), 'Ascension', 1);
  add(addDays(E, 50), 'Lundi de Pentecôte', 1);
  add(new Date(y, 6, 14), 'Fête nationale', 1);
  add(new Date(y, 7, 15), 'Assomption', 1);
  add(new Date(y, 10, 1), 'Toussaint', 1);
  add(new Date(y, 10, 11), 'Armistice 1918', 1);
  add(new Date(y, 11, 25), 'Noël', 1);
  // Fêtes et dates à retenir
  const j2 = new Date(y, 0, 2);
  add(addDays(j2, (7 - j2.getDay()) % 7), 'Épiphanie', 0);
  add(new Date(y, 1, 2), 'Chandeleur', 0);
  add(new Date(y, 1, 14), 'Saint-Valentin', 0);
  add(addDays(E, -47), 'Mardi gras', 0);
  add(nthSunday(y, 2, 1), 'Fête des grands-mères', 0);
  add(lastSunday(y, 2), "Passage à l'heure d'été", 0);
  add(new Date(y, 3, 1), "Poisson d'avril", 0);
  add(E, 'Pâques', 0);
  add(addDays(E, 49), 'Pentecôte', 0);
  let mothers = lastSunday(y, 4);
  if (ymd(mothers) === ymd(addDays(E, 49))) mothers = addDays(mothers, 7);
  add(mothers, 'Fête des mères', 0);
  add(nthSunday(y, 5, 3), 'Fête des pères', 0);
  add(new Date(y, 5, 21), 'Fête de la musique', 0);
  add(lastSunday(y, 9), "Passage à l'heure d'hiver", 0);
  add(new Date(y, 9, 31), 'Halloween', 0);
  add(new Date(y, 11, 24), 'Réveillon de Noël', 0);
  add(new Date(y, 11, 31), 'Saint-Sylvestre', 0);
  return (HCACHE[y] = H);
}
const holidaysOn = k => holidays(+k.slice(0, 4))[k] || [];

const partsOf = e => e.participants || [];
const eventColor = e => e.color || (partsOf(e).length === 1 ? colorOf(partsOf(e)[0]) : 'var(--both)');
const partLabel = ids => ids.length ? ids.map(nameOf).join(' et ') : 'Tous';

function eventsByDay() {
  const byDay = {};
  for (const e of S.events) {
    const end = e.end_day && e.end_day > e.day ? e.end_day : e.day;
    let d = parse(e.day);
    for (let n = 0; n < 62; n++) {
      const k = ymd(d);
      (byDay[k] ||= []).push(e);
      if (k >= end) break;
      d = addDays(d, 1);
    }
  }
  return byDay;
}

const MAX_LANES = 3;
const HOL_COLOR = { 1: '#616161', 0: '#8A8A8A' };
const hourLabel = t => { const [h, m] = t.slice(0, 5).split(':'); return m === '00' ? `${+h} h` : `${h}:${m}`; };
// Texte blanc ou foncé selon la clarté de la couleur de fond
function inkOn(c) {
  const m = /^#([0-9a-f]{6})$/i.exec(c || ''); if (!m) return '#fff';
  const n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 190 ? '#18213A' : '#fff';
}
const evRank = it => it.hol ? 0 : it.multi ? 1 : (it.ev.all_day || !it.ev.start_time) ? 2 : 3;

// Une ligne de semaine : cases cliquables + barres d'évènements réparties en couloirs
function weekRow(start, mo, tk, byDay) {
  const days = [...Array(7)].map((_, i) => ymd(addDays(start, i)));
  const first = days[0], last = days[6], items = [];
  days.forEach((k, i) => holidaysOn(k).forEach(h => items.push({ hol: h, s: i, e: i })));
  for (const ev of S.events) {
    const end = ev.end_day && ev.end_day > ev.day ? ev.end_day : ev.day;
    if (end < first || ev.day > last) continue;
    items.push({ ev, s: ev.day < first ? 0 : days.indexOf(ev.day), e: end > last ? 6 : days.indexOf(end),
      l: ev.day < first, r: end > last, multi: end > ev.day });
  }
  items.sort((a, b) => evRank(a) - evRank(b) || a.s - b.s || (b.e - b.s) - (a.e - a.s)
    || (a.ev?.start_time || '').localeCompare(b.ev?.start_time || ''));
  const lanes = [], hidden = Array(7).fill(0);
  for (const it of items) {
    let n = lanes.findIndex(L => L.slice(it.s, it.e + 1).every(x => !x));
    if (n < 0) { n = lanes.length; lanes.push(Array(7).fill(false)); }
    for (let c = it.s; c <= it.e; c++) lanes[n][c] = true;
    it.lane = n;
    if (n >= MAX_LANES) for (let c = it.s; c <= it.e; c++) hidden[c]++;
  }
  const used = Math.min(lanes.length, MAX_LANES), more = hidden.some(Boolean);
  const cells = days.map((k, i) => {
    const d = parse(k), hol = holidaysOn(k), n = (byDay[k] || []).length;
    const label = [dayLong(d), ...hol.map(h => h.name), n ? `${n} évènement${n > 1 ? 's' : ''}` : ''].filter(Boolean).join(', ');
    const cls = [d.getMonth() !== mo && 'out', k === tk && 'is-today', k === S.selDay && 'sel', hol.some(h => h.ferie) && 'ferie'].filter(Boolean).join(' ');
    return `<button class="mcell ${cls}" style="grid-column:${i + 1}" data-day="${k}" aria-label="${esc(label)}"><span class="num">${d.getDate()}</span></button>`;
  }).join('');
  const bars = items.filter(it => it.lane < MAX_LANES).map(it => {
    const pos = `grid-column:${it.s + 1}/${it.e + 2};grid-row:${it.lane + 2}`;
    if (it.hol) return `<span class="eb" style="${pos};background:${HOL_COLOR[it.hol.ferie]}" aria-hidden="true">${esc(it.hol.name)}</span>`;
    const e = it.ev, c = eventColor(e), timed = !e.all_day && e.start_time && !it.l;
    return `<button class="eb ${it.l ? 'l' : ''} ${it.r ? 'r' : ''}" style="${pos};background:${c};color:${inkOn(c)}" data-event="${e.id}">${timed ? `<b>${hourLabel(e.start_time)}</b>` : ''}${esc(e.title)}</button>`;
  }).join('');
  const extra = hidden.map((n, i) => n ? `<button class="emore" style="grid-column:${i + 1};grid-row:${used + 2}" data-day="${days[i]}" aria-label="${n} autre${n > 1 ? 's' : ''} évènement${n > 1 ? 's' : ''}">+${n}</button>` : '').join('');
  return `<div class="mweek" style="grid-template-rows:30px repeat(${used + (more ? 1 : 0)},var(--lane)) 1fr">${cells}${bars}${extra}</div>`;
}

function vAgenda() {
  const m = S.month, mo = m.getMonth(), start = mondayOf(m), tk = todayK();
  const byDay = eventsByDay();
  let weeks = '';
  for (let w = 0; w < 6; w++) {
    const ws = addDays(start, w * 7);
    if (w > 0 && ws.getMonth() !== mo) break;
    weeks += weekRow(ws, mo, tk, byDay);
  }
  const hol = holidaysOn(S.selDay);
  const sel = (byDay[S.selDay] || []).slice().sort((a, b) =>
    (b.all_day ? 1 : 0) - (a.all_day ? 1 : 0) || (a.start_time || '').localeCompare(b.start_time || ''));

    if (multi) return `${e.day === S.selDay ? 'Dès le' : 'Jusqu’au'}<small>${shortDate(e.day === S.selDay ? e.day : e.end_day)}</small>`;
    if (e.all_day || !e.start_time) return 'Journée';

  const rows = [

  ];
  return `
    <div class="bar">
      <button class="iconbtn sm" data-nav="prev" aria-label="Mois précédent">‹</button>
      <h2>${monthLong(m)}</h2>
      <button class="iconbtn sm" data-nav="next" aria-label="Mois suivant">›</button>
    </div>
    <div class="month">
      <div class="mhead">${['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'].map(x => `<span>${x}</span>`).join('')}</div>

}

const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();

function suggestionsFor(q) {
  const n = norm(q); if (!n) return [];
  const list = S.lists.find(l => l.id === S.curList);
  const onList = new Set(S.items.filter(i => i.list_id === S.curList && !i.done).map(i => norm(i.text)));
  // D'abord ce que le foyer a déjà noté (le plus fréquent en tête), puis le dictionnaire d'aliments
  const freq = new Map();
  for (const i of S.items) { const k = norm(i.text); const f = freq.get(k) || { text: i.text, n: 0 }; f.n++; freq.set(k, f); }
  const pool = [...[...freq.values()].sort((a, b) => b.n - a.n).map(f => ({ text: f.text, known: true })),
    ...(isGrocery(list) || !S.items.some(i => i.list_id === S.curList) ? FOODS.map(text => ({ text })) : [])];
  const seen = new Set(), pre = [], mid = [];
  for (const s of pool) {
    const k = norm(s.text);
    if (seen.has(k) || onList.has(k) || k === n) continue;
    seen.add(k);
    if (k.startsWith(n)) pre.push(s);
    else if (k.split(/[\s'-]/).some(w => w.startsWith(n)) || (n.length >= 3 && k.includes(n))) mid.push(s);
  }
  return [...pre, ...mid].slice(0, 6);
}

function showSuggestions(typed) {
  const ul = $('#sugg'), input = $('#newItem'); if (!ul || !input) return;
  const list = typed ? suggestionsFor(typed) : [];
  const n = norm(typed).length;
  ul.innerHTML = list.map((s, i) => {
    const pre = norm(s.text).startsWith(norm(typed));
    const label = pre ? `<b>${esc(s.text.slice(0, n))}</b>${esc(s.text.slice(n))}` : esc(s.text);
    return `<li role="option"><button type="button" class="${i === 0 && pre ? 'on' : ''}" data-sugg="${esc(s.text)}"><span>${label}</span>${s.known ? '<small>déjà noté</small>' : ''}</button></li>`;
  }).join('');
  input.setAttribute('aria-expanded', String(list.length > 0));
  return list;
}

function onMainInput(e) {
  if (e.target.id !== 'newItem') return;
  const input = e.target, typed = input.value;
  const list = showSuggestions(typed);
  // Complète directement dans le champ : la fin proposée est sélectionnée, Entrée valide, une lettre de plus la remplace
  if (!list?.length || !(e.inputType || '').startsWith('insert') || input.selectionStart !== typed.length) return;
  const best = list[0];
  if (!norm(best.text).startsWith(norm(typed))) return;
  input.value = best.text;
  input.setSelectionRange(typed.length, input.value.length);
}

function onMainKeydown(e) {
  if (e.target.id !== 'newItem') return;
  const input = e.target;
  if ((e.key === 'Tab' || e.key === 'ArrowRight') && input.selectionEnd === input.value.length && input.selectionStart < input.selectionEnd) {
    e.preventDefault(); input.setSelectionRange(input.value.length, input.value.length);
  }
  if (e.key === 'Escape') { $('#sugg').innerHTML = ''; input.setAttribute('aria-expanded', 'false'); }
}

/* ---------- Vue Budget ---------- */
function balance() {
  if (S.members.length < 2) return null;
  const [a, b] = S.members;
  let v = 0; // positif : b doit à a
  for (const e of S.expenses) {
    const amt = Number(e.amount), sign = e.paid_by === a.user_id ? 1 : e.paid_by === b.user_id ? -1 : 0;
    if (!sign) continue;
    if (e.split === 'half') v += sign * amt / 2;
    else if (e.split === 'other') v += sign * amt;
  }
  v = Math.round(v * 100) / 100;
  if (Math.abs(v) < 0.01) return { even: true };
  return v > 0 ? { debtor: b, creditor: a, amount: v } : { debtor: a, creditor: b, amount: -v };
}

function vBudget() {
  const prefix = `${S.bMonth.getFullYear()}-${pad(S.bMonth.getMonth() + 1)}`;
  const month = S.expenses.filter(e => e.day.startsWith(prefix));
  const spend = month.filter(e => e.category !== 'Remboursement');
  const total = spend.reduce((s, e) => s + Number(e.amount), 0);
  const shared = spend.filter(e => e.split === 'half').reduce((s, e) => s + Number(e.amount), 0);
  const byCat = {};
  spend.forEach(e => byCat[e.category] = (byCat[e.category] || 0) + Number(e.amount));
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const max = cats[0]?.[1] || 1;
  const bal = balance();
  const balHtml = !bal
    ? `<p>Invitez votre partenaire depuis les réglages pour suivre qui doit quoi.</p>`
    : bal.even
      ? `<p>Équilibre entre vous deux</p><div class="amt">${eur(0)}</div><p>Personne ne doit rien à personne.</p>`
      : `<p>${esc(bal.debtor.display_name)} doit à ${esc(bal.creditor.display_name)}</p><div class="amt">${eur(bal.amount)}</div><p>Solde cumulé de toutes les dépenses partagées.</p><button class="btn" data-act="settle">Enregistrer le remboursement</button>`;
  return `
    <div class="balance">${balHtml}</div>
    <div class="bar" style="margin-top:22px">
      <button class="iconbtn sm" data-nav="bprev" aria-label="Mois précédent">‹</button>
      <h2>${monthLong(S.bMonth)}</h2>
      <button class="iconbtn sm" data-nav="bnext" aria-label="Mois suivant">›</button>
    </div>
    <div class="stats"><div><small>Dépensé ce mois</small><strong>${eur(total)}</strong></div><div><small>Dont partagé</small><strong>${eur(shared)}</strong></div></div>
    ${cats.length ? `<h3 class="sub">Par catégorie</h3><ul class="cats">${cats.map(([c, v]) => `<li><span>${esc(c)}</span><div class="meter"><i style="width:${Math.max(4, v / max * 100)}%"></i></div><b>${eur(v)}</b></li>`).join('')}</ul>` : ''}
    <h3 class="sub">Dépenses</h3>
    ${month.length ? `<ul class="evlist panel">${month.map(e => `<li><button class="exp" data-exp="${e.id}">
        <span class="dot" style="background:${colorOf(e.paid_by)}"></span>
        <span class="body"><strong>${esc(e.label)}</strong><span>${esc(e.category)}, ${parse(e.day).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}, ${esc(nameOf(e.paid_by))}${e.split !== 'half' ? `, ${SPLITS[e.split].toLowerCase()}` : ''}</span></span>
        <span class="amt">${eur(e.amount)}</span></button></li>`).join('')}</ul>`
      : `<p class="hint">Aucune dépense ce mois-ci. Ajoutez-en une avec le bouton +.</p>`}`;
}

/* ---------- Interactions ---------- */
async function onMainClick(e) {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (S.listMenu && d.act !== 'listMenu') S.listMenu = false;
  if (d.sugg) return addItem(d.sugg);
  // Un clic sur une case du mois ouvre directement la création d'un évènement ce jour-là
  if (d.day && b.classList.contains('mcell')) {
    S.selDay = d.day; const p = parse(d.day);
    if (p.getMonth() !== S.month.getMonth()) S.month = firstOfMonth(p);
    render(); return eventModal();
  }
  if (d.day) { S.selDay = d.day; const p = parse(d.day); if (p.getMonth() !== S.month.getMonth()) S.month = firstOfMonth(p); return render(); }
  if (d.nav) {
    const m = S.month, bm = S.bMonth;
    if (d.nav === 'prev') S.month = new Date(m.getFullYear(), m.getMonth() - 1, 1);
    if (d.nav === 'next') S.month = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    if (d.nav === 'today') { S.selDay = todayK(); S.month = firstOfMonth(new Date()); }
    if (d.nav === 'wprev') S.week = addDays(S.week, -7);
    if (d.nav === 'wnext') S.week = addDays(S.week, 7);
    if (d.nav === 'bprev') S.bMonth = new Date(bm.getFullYear(), bm.getMonth() - 1, 1);
    if (d.nav === 'bnext') S.bMonth = new Date(bm.getFullYear(), bm.getMonth() + 1, 1);
    return render();
  }
  if (d.event) { const ev = S.events.find(x => x.id === d.event); return ev && eventDetail(ev); }
  if (d.exp) return expenseModal(S.expenses.find(x => x.id === d.exp));
  if (d.meal) { const [day, slot] = d.meal.split('|'); return mealModal(day, slot); }
  if (d.list) { S.curList = d.list; localStorage.setItem('foyer_list', d.list); return render(); }
  if (d.toggle) {
    const it = S.items.find(i => i.id === d.toggle); if (!it) return;
    it.done = !it.done; render();
    const { error } = await S.sb.from('list_items').update({ done: it.done }).eq('id', it.id);
    if (error) { it.done = !it.done; render(); toast(errMsg(error)); }
    return;
  }
  if (d.delItem) {
    S.items = S.items.filter(i => i.id !== d.delItem); render();
    const { error } = await S.sb.from('list_items').delete().eq('id', d.delItem);
    if (error) { toast(errMsg(error)); reload('list_items').then(render); }
    return;
  }
  switch (d.act) {
    case 'listMenu': S.listMenu = !S.listMenu; render(); return S.listMenu && document.querySelector('.lhead .kmenu button')?.focus();
    case 'newList': render(); return listModal();
    case 'editList': render(); return listModal(S.lists.find(l => l.id === S.curList));
    case 'delList': {
      render();
      const list = S.lists.find(l => l.id === S.curList); if (!list) return;
      if (!confirm(`Supprimer la liste « ${list.name} » et tout son contenu ?`)) return;
      try { await run('lists', S.sb.from('lists').delete().eq('id', list.id)); await reload('list_items'); S.curList = null; render(); } catch {}
      return;
    }
    case 'clearDone':
      return run('list_items', S.sb.from('list_items').delete().eq('list_id', S.curList).eq('done', true)).catch(() => {});
    case 'sendWeek': {
      const keys = [...Array(7)].map((_, i) => ymd(addDays(S.week, i)));
      const lines = S.meals.filter(m => keys.includes(m.day)).flatMap(m => splitLines(m.ingredients));
      if (!lines.length) return toast("Aucun ingrédient renseigné cette semaine. Ouvrez un repas pour en ajouter.");
      return sendToGroceries(lines);
    }
    case 'settle': {
      const bal = balance(); if (!bal || bal.even) return;
      if (!confirm(`Enregistrer que ${bal.debtor.display_name} a remboursé ${eur(bal.amount)} à ${bal.creditor.display_name} ?`)) return;
      return run('expenses', S.sb.from('expenses').insert({
        household_id: S.hh.id, day: todayK(), label: 'Remboursement', amount: bal.amount,
        category: 'Remboursement', paid_by: bal.debtor.user_id, split: 'other',
      })).then(() => toast('Remboursement enregistré')).catch(() => {});
    }
  }
}

async function onMainSubmit(e) {
  if (e.target.id !== 'addItem') return;
  e.preventDefault();
  addItem($('#newItem').value);
}

async function addItem(raw) {
  const text = raw.trim(), input = $('#newItem');
  if (!text) return;
  if (input) { input.value = ''; input.focus(); }
  showSuggestions('');
  await run('list_items', S.sb.from('list_items').insert({ household_id: S.hh.id, list_id: S.curList, text }))
    .catch(() => { const n = $('#newItem'); if (n) n.value = text; });
  $('#newItem')?.focus();
}

const splitLines = s => (s || '').split(/\n/).map(x => x.trim()).filter(Boolean);

async function groceriesList() {
  let l = S.lists.find(x => /courses/i.test(x.name)) || S.lists[0];
  if (l) return l;
  const { data, error } = await S.sb.from('lists').insert({ household_id: S.hh.id, name: 'Courses', position: 0 }).select().single();
  if (error) throw error;
  await reload('lists');
  return data;
}

async function sendToGroceries(lines) {
  try {
    const list = await groceriesList();
    const existing = new Set(S.items.filter(i => i.list_id === list.id && !i.done).map(i => i.text.toLowerCase()));
    const fresh = [...new Set(lines)].filter(x => !existing.has(x.toLowerCase()));
    if (!fresh.length) return toast(`Tout est déjà dans ${list.name}.`);
    await run('list_items', S.sb.from('list_items').insert(fresh.map(text => ({ household_id: S.hh.id, list_id: list.id, text }))));
    toast(`${fresh.length} ingrédient${fresh.length > 1 ? 's' : ''} ajouté${fresh.length > 1 ? 's' : ''} à ${list.name}`);
  } catch (e) { toast(errMsg(e)); }
}

function sheet(html, mount) {
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<form class="sheet" role="dialog" aria-modal="true">${html}</form>`;
  document.body.appendChild(scrim);
  const prev = document.activeElement;
  const close = () => { scrim.remove(); document.removeEventListener('keydown', onKey); prev?.focus?.(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  scrim.addEventListener('click', e => { if (e.target === scrim) close(); });
  const f = scrim.querySelector('.sheet');
  f.querySelector('[data-close]')?.addEventListener('click', close);
  mount(f, close);
  setTimeout(() => f.querySelector('[autofocus]')?.focus(), 60);
}

function whenText(e) {
  const dl = k => parse(k).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const t = x => x.slice(0, 5);
  const multi = e.end_day && e.end_day > e.day, timed = !e.all_day && e.start_time;
  if (!multi) {
    if (!timed) return `${dl(e.day)} - toute la journée`;
    return `${dl(e.day)} ${e.end_time ? `de ${t(e.start_time)} à ${t(e.end_time)}` : `à ${t(e.start_time)}`}`;
  }
  if (!timed) return `Du ${dl(e.day)} au ${dl(e.end_day)}`;
  return `Du ${dl(e.day)} à ${t(e.start_time)} au ${dl(e.end_day)}${e.end_time ? ` à ${t(e.end_time)}` : ''}`;
}

        day: fd.get('day'), paid_by: fd.get('paid_by'), split: fd.get('split') };
      try {
        await run('expenses', ex ? S.sb.from('expenses').update(row).eq('id', ex.id) : S.sb.from('expenses').insert(row));
        S.bMonth = firstOfMonth(parse(row.day)); render(); close();
      } catch {}
    };
    f.querySelector('[data-del]')?.addEventListener('click', async () => {
      if (!confirm(`Supprimer « ${ex.label} » ?`)) return;
      try { await run('expenses', S.sb.from('expenses').delete().eq('id', ex.id)); close(); } catch {}
    });
  });
}

function settingsModal() {
  const m = me();
  sheet(`<h2>Réglages</h2>
    <label>Votre prénom<input name="name" value="${esc(m.display_name)}" required></label>
    <fieldset class="swatches"><legend>Votre couleur</legend>${COLORS.map(c => `<label class="sw"><input type="radio" name="color" value="${c}" ${c === m.color ? 'checked' : ''} aria-label="Couleur ${c}"><span style="background:${c}"></span></label>`).join('')}</fieldset>
    <label>Nom du foyer<input name="hh" value="${esc(S.hh.name)}" required></label>
    ${other() ? '' : `<div class="invite"><p>Pour inviter votre partenaire : il crée son compte, choisit « Rejoindre le foyer » et colle ce code.</p><code>${S.hh.id}</code><button type="button" class="btn ghost" data-copy>Copier le code</button></div>`}
    <div class="actions"><button type="button" class="btn ghost" data-logout>Se déconnecter</button><button class="btn">Enregistrer</button></div>`,
  (f, close) => {
    f.onsubmit = async x => {
      x.preventDefault();
      const fd = new FormData(f);
      try {
        const r1 = await S.sb.from('members').update({ display_name: fd.get('name').trim(), color: fd.get('color') || m.color })
          .eq('household_id', S.hh.id).eq('user_id', S.user.id);
        if (r1.error) throw r1.error;
        const name = fd.get('hh').trim();
        if (name !== S.hh.name) {
          const r2 = await S.sb.from('households').update({ name }).eq('id', S.hh.id);
          if (r2.error) throw r2.error;
          S.hh.name = name;
        }
        await reload('members'); render(); close(); toast('Réglages enregistrés');
      } catch (e) { toast(errMsg(e)); }
    };
    f.querySelector('[data-copy]')?.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(S.hh.id); toast('Code copié'); } catch { toast('Copie impossible, sélectionnez le code à la main.'); }
    });
    f.querySelector('[data-logout]').onclick = async () => { close(); await S.sb.auth.signOut(); };
  });
}

boot();
</script>
